<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NARDA OMS 관리자</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#f5f7fb}.order-table th{white-space:nowrap}.company-row{cursor:pointer}</style>
</head>
<body>
<header class="navbar navbar-dark bg-dark px-3 px-md-4"><span class="navbar-brand fw-bold">NARDA OMS 관리자</span><button class="btn btn-outline-light btn-sm" onclick="logout()">로그아웃</button></header>
<main class="container-fluid p-3 p-md-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h1 class="h4 mb-1">업체 현황</h1><div class="text-secondary">업체별 주문·발송 현황을 조회합니다.</div></div><button class="btn btn-outline-secondary" onclick="loadAdminData()">새로고침</button></div>
    <div class="row g-3">
        <div class="col-xl-4"><div class="card shadow-sm"><div class="card-header fw-bold">업체 목록</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>업체</th><th>계정</th><th>주문</th><th>발송완료</th></tr></thead><tbody id="companiesBody"></tbody></table></div></div></div>
        <div class="col-xl-8"><div class="card shadow-sm"><div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2"><strong>업체 발송 내역</strong><select id="companyFilter" class="form-select" style="max-width:320px" onchange="loadCompanyOrders()"><option value="">전체 업체</option></select></div><div class="table-responsive"><table class="table table-sm table-striped order-table mb-0"><thead><tr><th>업체</th><th>발송일</th><th>주문번호</th><th>수취인</th><th>택배사</th><th>송장번호</th><th>상품</th></tr></thead><tbody id="ordersBody"><tr><td colspan="7" class="text-center p-4">불러오는 중입니다.</td></tr></tbody></table></div></div></div>
    </div>
</main>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
async function loadAdminData(){
    try{
        const res=await fetch('/api/admin/companies');if(!res.ok)throw new Error('업체 목록을 불러오지 못했습니다.');
        const companies=await res.json(), filter=document.getElementById('companyFilter'), previous=filter.value;
        document.getElementById('companiesBody').innerHTML=companies.map(c=>`<tr class="company-row" onclick="selectCompany('${c.id}')"><td>${esc(c.name)}${c.active?'':' <span class="badge bg-secondary">중지</span>'}</td><td>${c.user_count}</td><td>${c.order_count}</td><td>${c.dispatched_count}</td></tr>`).join('')||'<tr><td colspan="4" class="text-center p-4">등록 업체가 없습니다.</td></tr>';
        filter.innerHTML='<option value="">전체 업체</option>'+companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
        if([...filter.options].some(o=>o.value===previous))filter.value=previous;
        await loadCompanyOrders();
    }catch(e){document.getElementById('companiesBody').innerHTML=`<tr><td colspan="4" class="text-danger p-3">${esc(e.message)}</td></tr>`;}
}
function selectCompany(id){document.getElementById('companyFilter').value=id;loadCompanyOrders();}
async function loadCompanyOrders(){
    const companyId=document.getElementById('companyFilter').value;
    const res=await fetch('/api/admin/orders'+(companyId?'?company_id='+encodeURIComponent(companyId):''));
    const orders=await res.json();
    document.getElementById('ordersBody').innerHTML=orders.map(o=>`<tr><td>${esc(o.company_name)}</td><td>${esc(o.dispatched_at||o.created_at||'')}</td><td>${esc(o.order_no)}</td><td>${esc(o.recipient_name)}</td><td>${esc(o.courier)}</td><td>${esc(o.tracking_no)}</td><td>${esc([o.original_product_name,o.original_option_name].filter(Boolean).join(' / '))}</td></tr>`).join('')||'<tr><td colspan="7" class="text-center p-4">발송 내역이 없습니다.</td></tr>';
}
async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/login';}
loadAdminData();
</script>
</body>
</html>
