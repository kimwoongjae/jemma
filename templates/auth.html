<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NARDA OMS 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{min-height:100vh;background:linear-gradient(145deg,#eef4ff,#f7f9fc);display:grid;place-items:center;padding:20px}
        .auth-card{width:min(100%,480px);border:0;border-radius:18px;box-shadow:0 16px 45px #1c31531a}
        .brand{font-weight:800;color:#245fe8}.nav-pills .nav-link.active{background:#3167ee}
    </style>
</head>
<body>
<main class="card auth-card"><div class="card-body p-4 p-md-5">
    <div class="text-center mb-4"><div class="brand fs-3">NARDA OMS</div><div class="text-secondary">주문·재고·발송 관리</div></div>
    <ul class="nav nav-pills nav-fill mb-4" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login" type="button">로그인</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#register" type="button">업체 회원가입</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#join" type="button">초대 가입</button></li>
    </ul>
    <div id="authMessage" class="alert d-none" role="alert"></div>
    <div class="tab-content">
        <section class="tab-pane fade show active" id="login">
            <form onsubmit="submitAuth(event, '/api/auth/login')">
                <label class="form-label">아이디</label><input class="form-control mb-3" name="username" required autocomplete="username">
                <label class="form-label">비밀번호</label><input class="form-control mb-4" name="password" type="password" required autocomplete="current-password">
                <button class="btn btn-primary w-100 py-2">로그인</button>
            </form>
        </section>
        <section class="tab-pane fade" id="register">
            <form onsubmit="submitAuth(event, '/api/auth/register')">
                <label class="form-label">업체명</label><input class="form-control mb-3" name="company_name" required maxlength="100" placeholder="업체명을 입력하세요">
                <label class="form-label">대표 아이디</label><input class="form-control mb-3" name="username" required minlength="3" maxlength="40" autocomplete="username">
                <label class="form-label">비밀번호 (10자 이상)</label><input class="form-control mb-4" name="password" type="password" required minlength="10" autocomplete="new-password">
                <button class="btn btn-primary w-100 py-2">업체 만들기</button>
            </form>
        </section>
        <section class="tab-pane fade" id="join">
            <form onsubmit="submitAuth(event, '/api/auth/join')">
                <label class="form-label">업체 초대 코드</label><input class="form-control mb-3 text-uppercase" name="invite_code" required autocomplete="off">
                <label class="form-label">아이디</label><input class="form-control mb-3" name="username" required minlength="3" maxlength="40" autocomplete="username">
                <label class="form-label">비밀번호 (10자 이상)</label><input class="form-control mb-4" name="password" type="password" required minlength="10" autocomplete="new-password">
                <button class="btn btn-primary w-100 py-2">업체에 가입</button>
            </form>
        </section>
    </div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function submitAuth(event, url){
    event.preventDefault();
    const form=event.currentTarget, payload=Object.fromEntries(new FormData(form));
    const box=document.getElementById('authMessage'); box.className='alert d-none';
    try{
        const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const data=await res.json();
        if(!res.ok) throw new Error(data.error||'요청을 처리하지 못했습니다.');
        if(data.invite_code){
            box.className='alert alert-success';
            box.innerHTML=`업체가 생성되었습니다. 직원 초대 코드: <strong>${data.invite_code}</strong><br>이 코드를 직원에게 안전하게 전달하세요.`;
            setTimeout(()=>location.href=data.redirect,5000);
            return;
        }
        location.href=data.redirect||'/';
    }catch(error){box.className='alert alert-danger';box.textContent=error.message;}
}
</script>
</body>
</html>
